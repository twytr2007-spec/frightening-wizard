name: Build libFLEX
on:
  workflow_dispatch:
  push:
    paths:
      - 'Loader.m'
      - '.github/workflows/flex.yml'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get FLEX
        run: git clone --depth=1 https://github.com/FLEXTool/FLEX.git FLEX

      - name: Build libFLEX.dylib
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          INC=$(find FLEX/Classes -type d | sed 's/^/-I/' | tr '\n' ' ')
          export CF="-arch arm64 -isysroot $SDK -miphoneos-version-min=14.0 -fobjc-arc -fmodules -w -O1 $INC"
          mkdir -p obj out
          { find FLEX/Classes -type f \( -name '*.m' -o -name '*.mm' -o -name '*.c' \); echo Loader.m; } > files.txt
          wc -l files.txt
          cat files.txt | xargs -P 4 -I{} sh -c 'xcrun -sdk iphoneos clang $CF -c "{}" -o "obj/$(echo {} | tr / _).o"'
          xcrun -sdk iphoneos clang -arch arm64 -isysroot $SDK -miphoneos-version-min=14.0 \
            -dynamiclib obj/*.o -o out/libFLEX.dylib -install_name @rpath/libFLEX.dylib \
            -framework Foundation -framework UIKit -framework CoreGraphics -framework ImageIO \
            -framework QuartzCore -framework WebKit -framework Security -framework SceneKit \
            -framework UniformTypeIdentifiers -framework Photos -framework AVFoundation \
            -framework CoreData -framework MobileCoreServices -lsqlite3 -lz -lc++
          ls -la out

      - name: Sign
        run: |
          brew install ldid
          ldid -S out/libFLEX.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: libFLEX-dylib
          path: out/libFLEX.dylib
